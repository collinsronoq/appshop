services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appshop
      POSTGRES_USER: appshop
      POSTGRES_PASSWORD: appshop
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appshop -d appshop"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  api:
    build:
      context: ./backend
    environment:
      ENV: development
      DATABASE_URL: postgresql+asyncpg://appshop:appshop@postgres:5432/appshop
      MIGRATION_DATABASE_URL: postgresql+psycopg://appshop:appshop@postgres:5432/appshop
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
